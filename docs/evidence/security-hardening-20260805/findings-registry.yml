# Satori security-hardening findings registry
#
# Tracked status record for findings whose piolium drafts are git-ignored
# (piolium/** at .gitignore:103) and therefore cannot carry the ancestry/status
# gate in CI. The validator (scripts/check-piolium-findings.mjs --registry)
# enforces the same consistency rules on this registry as on tracked drafts:
#   - status enum, non-empty verified_at resolving to a commit
#   - fixed_in (when non-empty) resolving to a commit and ancestral to the head
#   - accepted/fixed require non-empty fixed_in; open requires empty fixed_in
#   - fixed additionally requires non-empty fix_verified_at resolving to a
#     commit ancestral to the head
#   - verified_at must be an ancestor of the audited head and, for fixed,
#     at or after the fix point (commit order)
#   - IDs must not duplicate tracked draft IDs or each other

findings:
  - id: M1
    status: accepted
    verified_at: "b7da4e6190340d172d6e30df521959fec5f0b73d"
    fixed_in: "b7da4e6190340d172d6e30df521959fec5f0b73d"
    fix_verified_at: "b7da4e6190340d172d6e30df521959fec5f0b73d"
    resolution: "same-UID processes are inside the documented trust boundary; protocol v2 states this honestly (challengeNonce is a freshness challenge, ownershipToken is lifecycle-only)"
  - id: M2
