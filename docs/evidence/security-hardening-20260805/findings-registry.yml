# Satori security-hardening findings registry
#
# Tracked status record for findings whose piolium drafts are git-ignored
# (piolium/** at .gitignore:103) and therefore cannot carry the ancestry/status
# gate in CI. The validator (scripts/check-piolium-findings.mjs --registry)
# enforces the same consistency rules on this registry as on tracked drafts:
#   - status enum, non-empty verified_at resolving to a commit
#   - fixed_in (when non-empty) resolving to a commit
#   - accepted/fixed require non-empty fixed_in; open requires empty fixed_in
#   - verified_at must be an ancestor of the audited head
#   - IDs must not duplicate tracked draft IDs or each other

