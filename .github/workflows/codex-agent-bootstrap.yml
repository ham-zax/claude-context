name: Codex agent bootstrap

on:
  push:
    branches:
      - codex/ranking-v3-r0-1a-fixture
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply staged agent patch
        id: apply_patch
        shell: bash
        run: |
          set -euo pipefail
          patch_path=.agent-patches/pending.patch
          if [[ ! -f "$patch_path" ]]; then
            echo "applied=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          changed_paths=$(git diff --name-only HEAD^ HEAD)
          if [[ "$changed_paths" != "$patch_path" ]]; then
            echo "Patch transport commit must change only $patch_path" >&2
            exit 1
          fi

          expected_parent=$(sed -n 's/^# agent-parent-sha: //p' "$patch_path" | head -n 1)
          commit_message=$(sed -n 's/^# agent-commit-message: //p' "$patch_path" | head -n 1)
          actual_parent=$(git rev-parse HEAD^)
          if [[ ! "$expected_parent" =~ ^[a-f0-9]{40}$ || "$actual_parent" != "$expected_parent" ]]; then
            echo "Patch parent mismatch: expected=$expected_parent actual=$actual_parent" >&2
            exit 1
          fi
          if [[ -z "$commit_message" ]]; then
            echo "Patch commit message is missing" >&2
            exit 1
          fi

          sed '/^# agent-parent-sha: /d; /^# agent-commit-message: /d' \
            "$patch_path" > /tmp/agent.patch
          git apply --check /tmp/agent.patch
          git apply /tmp/agent.patch
          rm "$patch_path"
          rmdir .agent-patches 2>/dev/null || true

          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "$commit_message"
          git push origin "HEAD:${GITHUB_REF_NAME}"
          echo "applied=true" >> "$GITHUB_OUTPUT"

      - name: Record effective branch head
        id: effective_head
        shell: bash
        run: |
          set -euo pipefail
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "tree=$(git rev-parse HEAD^{tree})" >> "$GITHUB_OUTPUT"

      - name: Create local-clone Git bundle
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin master --no-tags
          git update-ref refs/heads/agent-feature HEAD
          git update-ref refs/heads/agent-master refs/remotes/origin/master
          git bundle create satori-agent.bundle \
            refs/heads/agent-feature \
            refs/heads/agent-master
          git bundle verify satori-agent.bundle
          cat > agent-bundle-metadata.json <<EOF
          {
            "repository": "ham-zax/satori",
            "sourceBranch": "codex/ranking-v3-r0-1a-fixture",
            "sourceHead": "$(git rev-parse HEAD)",
            "sourceTree": "$(git rev-parse HEAD^{tree})",
            "masterHead": "$(git rev-parse refs/remotes/origin/master)",
            "masterTree": "$(git rev-parse refs/remotes/origin/master^{tree})"
          }
          EOF
          printf '%s\n' 125 > r0-1a-focused.status
          printf '%s\n' 125 > r0-1a-eval.status
          : > r0-1a-focused.log
          : > r0-1a-eval.log

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build workspace core package
        run: pnpm --filter @zokizuan/satori-core build

      - name: Run Ranking V3 verification and capture logs
        id: verify
        shell: bash
        run: |
          set +e
          set -o pipefail

          node --import tsx --test \
            evals/search-quality/ranking-v3-fixture-repair.test.ts \
            2>&1 | tee r0-1a-focused.log
          fixture_status=${PIPESTATUS[0]}

          script_tests=()
          while IFS= read -r test_file; do
            script_tests+=("$test_file")
          done < <(find scripts -maxdepth 1 -type f \
            \( -name 'ranking-v3*.test.mjs' -o -name 'verify-ranking-v3*.test.mjs' -o -name 'run-ranking-v3*.test.mjs' \) \
            -print | sort)
          if (( ${#script_tests[@]} > 0 )); then
            node --test "${script_tests[@]}" 2>&1 | tee ranking-v3-script-tests.log
            script_status=${PIPESTATUS[0]}
          else
            : > ranking-v3-script-tests.log
            script_status=0
          fi

          pnpm eval:search-quality \
            2>&1 | tee r0-1a-eval.log
          eval_status=${PIPESTATUS[0]}

          focused_status=0
          if [[ "$fixture_status" != "0" || "$script_status" != "0" ]]; then
            focused_status=1
          fi
          printf '%s\n' "$focused_status" > r0-1a-focused.status
          printf '%s\n' "$eval_status" > r0-1a-eval.status
          printf '%s\n' "$script_status" > ranking-v3-script-tests.status
          printf 'focused_status=%s\n' "$focused_status" >> "$GITHUB_OUTPUT"
          printf 'eval_status=%s\n' "$eval_status" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Upload bundle and verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: satori-agent-bundle-${{ steps.effective_head.outputs.sha }}
          if-no-files-found: error
          retention-days: 7
          path: |
            satori-agent.bundle
            agent-bundle-metadata.json
            r0-1a-focused.log
            r0-1a-eval.log
            r0-1a-focused.status
            r0-1a-eval.status
            ranking-v3-script-tests.log
            ranking-v3-script-tests.status

      - name: Publish bootstrap run locator
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          focused_status=$(cat r0-1a-focused.status 2>/dev/null || printf '%s' 125)
          eval_status=$(cat r0-1a-eval.status 2>/dev/null || printf '%s' 125)
          body=$(cat <<EOF
          Agent bootstrap run ID: ${GITHUB_RUN_ID}
          Commit: ${{ steps.effective_head.outputs.sha }}
          Artifact: satori-agent-bundle-${{ steps.effective_head.outputs.sha }}
          Applied staged patch: ${{ steps.apply_patch.outputs.applied }}
          Focused status: ${focused_status}
          Evaluation status: ${eval_status}
          EOF
          )
          gh api "repos/${GITHUB_REPOSITORY}/issues/3/comments" -f body="$body"

      - name: Enforce R0.1A verification result
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          focused_status=$(cat r0-1a-focused.status 2>/dev/null || printf '%s' 125)
          eval_status=$(cat r0-1a-eval.status 2>/dev/null || printf '%s' 125)
          if [[ "$focused_status" != "0" || "$eval_status" != "0" ]]; then
            echo "R0.1A verification failed: focused=$focused_status eval=$eval_status" >&2
            exit 1
          fi
