name: Codex Ranking V3 executor

on:
  push:
    branches:
      - codex/ranking-v3-d-to-i
    paths:
      - .agent-patches/READY
      - .github/workflows/codex-agent-bootstrap.yml
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  execute-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply verified staged patch
        id: apply_patch
        shell: bash
        run: |
          set -euo pipefail
          patch_dir=.agent-patches
          metadata="$patch_dir/METADATA"
          ready="$patch_dir/READY"

          if [[ ! -f "$ready" ]]; then
            echo "applied=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          test -f "$metadata"

          expected_base=$(sed -n 's/^base=//p' "$metadata" | head -n 1)
          commit_message=$(sed -n 's/^message=//p' "$metadata" | head -n 1)
          payload_encoding=$(sed -n 's/^encoding=//p' "$metadata" | head -n 1)
          expected_payload_sha=$(sed -n 's/^payloadSha256=//p' "$metadata" | head -n 1)
          expected_patch_sha=$(sed -n 's/^patchSha256=//p' "$metadata" | head -n 1)

          if [[ ! "$expected_base" =~ ^[a-f0-9]{40}$ ]]; then
            echo "Invalid staged-patch base SHA." >&2
            exit 1
          fi
          git merge-base --is-ancestor "$expected_base" HEAD
          while IFS= read -r changed_path; do
            if [[ "$changed_path" != .agent-patches/* ]]; then
              echo "Only .agent-patches/* may differ from staged-patch base: $changed_path" >&2
              exit 1
            fi
          done < <(git diff --name-only "$expected_base" HEAD)
          if [[ -z "$commit_message" ]]; then
            echo "Patch commit message is missing." >&2
            exit 1
          fi

          mapfile -t patch_parts < <(find "$patch_dir" -maxdepth 1 -type f -name 'part-*.patch' -print | sort)
          if (( ${#patch_parts[@]} == 0 )); then
            echo "Multipart transport has no patch parts." >&2
            exit 1
          fi

          if [[ "$payload_encoding" == "plain" ]]; then
            cat "${patch_parts[@]}" > /tmp/agent.patch
            actual_payload_sha=$(sha256sum /tmp/agent.patch | awk '{print $1}')
          elif [[ "$payload_encoding" == "gzip-base64" ]]; then
            cat "${patch_parts[@]}" | tr -d '\r\n' > /tmp/agent.payload.b64
            base64 --decode /tmp/agent.payload.b64 > /tmp/agent.payload.gz
            actual_payload_sha=$(sha256sum /tmp/agent.payload.gz | awk '{print $1}')
            gzip -t /tmp/agent.payload.gz
            gzip -dc /tmp/agent.payload.gz > /tmp/agent.patch
          else
            echo "Unsupported payload encoding: $payload_encoding" >&2
            exit 1
          fi

          if [[ "$actual_payload_sha" != "$expected_payload_sha" ]]; then
            echo "Payload digest mismatch: expected=$expected_payload_sha actual=$actual_payload_sha" >&2
            exit 1
          fi
          actual_patch_sha=$(sha256sum /tmp/agent.patch | awk '{print $1}')
          if [[ "$actual_patch_sha" != "$expected_patch_sha" ]]; then
            echo "Patch digest mismatch: expected=$expected_patch_sha actual=$actual_patch_sha" >&2
            exit 1
          fi

          git apply --check /tmp/agent.patch
          git apply /tmp/agent.patch
          rm -rf "$patch_dir"

          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "$commit_message"
          git push origin "HEAD:${GITHUB_REF_NAME}"
          echo "applied=true" >> "$GITHUB_OUTPUT"

      - name: Record effective head
        id: effective_head
        shell: bash
        run: |
          set -euo pipefail
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "tree=$(git rev-parse HEAD^{tree})" >> "$GITHUB_OUTPUT"

      - name: Create local Git bundle
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin master --no-tags
          git update-ref refs/heads/agent-feature HEAD
          git update-ref refs/heads/agent-master refs/remotes/origin/master
          git bundle create satori-agent.bundle refs/heads/agent-feature refs/heads/agent-master
          git bundle verify satori-agent.bundle
          cat > agent-bundle-metadata.json <<EOF
          {
            "repository": "ham-zax/satori",
            "sourceBranch": "codex/ranking-v3-d-to-i",
            "sourceHead": "$(git rev-parse HEAD)",
            "sourceTree": "$(git rev-parse HEAD^{tree})",
            "masterHead": "$(git rev-parse refs/remotes/origin/master)",
            "masterTree": "$(git rev-parse refs/remotes/origin/master^{tree})"
          }
          EOF
          printf '%s\n' 125 > ranking-v3-focused.status
          printf '%s\n' 125 > ranking-v3-eval.status
          : > ranking-v3-focused.log
          : > ranking-v3-eval.log

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build workspace packages
        shell: bash
        run: |
          set +e
          set -o pipefail
          pnpm --filter @zokizuan/satori-core build 2>&1 | tee ranking-v3-focused.log
          core_build=${PIPESTATUS[0]}
          pnpm --filter @zokizuan/satori-mcp build 2>&1 | tee -a ranking-v3-focused.log
          mcp_build=${PIPESTATUS[0]}
          if [[ "$core_build" != "0" || "$mcp_build" != "0" ]]; then
            printf '%s\n' 1 > ranking-v3-focused.status
            exit 1
          fi

      - name: Run Ranking V3 verification
        if: success()
        id: verify
        shell: bash
        run: |
          set +e
          set -o pipefail

          mapfile -t ts_tests < <(
            find packages evals -type f -name '*.test.ts' -print \
              | grep -E '(ranking-v3|ranking-|search-pass-evidence|search-rerank-evidence-retention|search-ranking-evidence-assembler)' \
              | sort -u
          )
          node --import tsx --test "${ts_tests[@]}" 2>&1 | tee -a ranking-v3-focused.log
          focused_status=${PIPESTATUS[0]}

          mapfile -t script_tests < <(
            find scripts -maxdepth 1 -type f -name '*.test.mjs' -print \
              | grep -E '(ranking|verify-ranking-v3|run-ranking-v3)' \
              | sort -u
          )
          if (( ${#script_tests[@]} > 0 )); then
            node --test "${script_tests[@]}" 2>&1 | tee -a ranking-v3-focused.log
            script_status=${PIPESTATUS[0]}
            if [[ "$script_status" != "0" ]]; then focused_status=1; fi
          fi

          pnpm --filter @zokizuan/satori-core typecheck 2>&1 | tee -a ranking-v3-focused.log
          core_status=${PIPESTATUS[0]}
          pnpm --filter @zokizuan/satori-mcp typecheck 2>&1 | tee -a ranking-v3-focused.log
          mcp_status=${PIPESTATUS[0]}
          if [[ "$core_status" != "0" || "$mcp_status" != "0" ]]; then focused_status=1; fi

          pnpm eval:search-quality 2>&1 | tee ranking-v3-eval.log
          eval_status=${PIPESTATUS[0]}

          printf '%s\n' "$focused_status" > ranking-v3-focused.status
          printf '%s\n' "$eval_status" > ranking-v3-eval.status
          printf 'focused_status=%s\n' "$focused_status" >> "$GITHUB_OUTPUT"
          printf 'eval_status=%s\n' "$eval_status" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Upload bundle and evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: satori-agent-bundle-${{ steps.effective_head.outputs.sha }}
          if-no-files-found: error
          retention-days: 7
          path: |
            satori-agent.bundle
            agent-bundle-metadata.json
            ranking-v3-focused.log
            ranking-v3-eval.log
            ranking-v3-focused.status
            ranking-v3-eval.status

      - name: Publish run locator
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          focused_status=$(cat ranking-v3-focused.status 2>/dev/null || printf '%s' 125)
          eval_status=$(cat ranking-v3-eval.status 2>/dev/null || printf '%s' 125)
          body=$(cat <<EOF
          Ranking V3 executor run ID: ${GITHUB_RUN_ID}
          Commit: ${{ steps.effective_head.outputs.sha }}
          Artifact: satori-agent-bundle-${{ steps.effective_head.outputs.sha }}
          Applied staged patch: ${{ steps.apply_patch.outputs.applied }}
          Focused status: ${focused_status}
          Evaluation status: ${eval_status}
          EOF
          )
          gh api "repos/${GITHUB_REPOSITORY}/issues/3/comments" -f body="$body"

      - name: Enforce verification
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          focused_status=$(cat ranking-v3-focused.status 2>/dev/null || printf '%s' 125)
          eval_status=$(cat ranking-v3-eval.status 2>/dev/null || printf '%s' 125)
          if [[ "$focused_status" != "0" || "$eval_status" != "0" ]]; then
            echo "Ranking V3 verification failed: focused=$focused_status eval=$eval_status" >&2
            exit 1
          fi
