name: Task7 Readiness Fix Once

on:
  push:
    branches:
      - integrate/language-spine-cbm-go

permissions:
  contents: write

jobs:
  apply-fix:
    if: github.event.head_commit.message == 'chore(task7): run readiness patch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch head
        uses: actions/checkout@v4
        with:
          ref: integrate/language-spine-cbm-go
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.x
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Apply exact stale-sync readiness fix
        run: node scripts/apply-task7-readiness-fix-once.mjs

      - name: Build Core
        run: pnpm --filter @zokizuan/satori-core build

      - name: Verify stale-sync wrapper regression
        run: pnpm --filter @zokizuan/satori-mcp test:raw src/core/handlers.stale-sync-readiness.test.ts

      - name: Commit production fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add packages/mcp/src/core/handlers.ts
          git diff --cached --check
          git commit -m 'fix(mcp): preserve proven reads during active sync'
          git push origin HEAD:integrate/language-spine-cbm-go
